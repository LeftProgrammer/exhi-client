<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Bridge 交互测试</title>
    <script src="exhi-pkg://pkg/__exhi__/bridge.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: radial-gradient(ellipse at top, #1e3a8a 0%, #0a1530 100%);
        color: #fff;
        font-family: 'Microsoft YaHei', monospace;
        overflow: hidden;
        user-select: none;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100%;
        padding: 40px;
        gap: 24px;
      }
      .left { display: flex; flex-direction: column; gap: 20px; }
      h1 { font-size: 40px; }
      .sub { font-size: 16px; opacity: 0.5; margin-top: -12px; }
      .group h2 { font-size: 13px; color: #60a5fa; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
      .btns { display: flex; flex-wrap: wrap; gap: 10px; }
      .btn {
        font-size: 16px; padding: 12px 20px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        cursor: pointer; transition: all 0.15s;
        white-space: nowrap;
      }
      .btn:hover, .btn:active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
      .right { display: flex; flex-direction: column; }
      .log-head { font-size: 13px; color: #60a5fa; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
      .log {
        flex: 1; overflow-y: auto;
        font-size: 13px; line-height: 1.7;
        background: rgba(0,0,0,0.3);
        border-radius: 10px;
        padding: 14px 16px;
        color: #94a3b8;
      }
      .log .ok  { color: #4ade80; }
      .log .err { color: #f87171; }
      .log .evt { color: #fbbf24; }
      .log .t   { color: #475569; margin-right: 6px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="left">
        <h1>Bridge 交互测试</h1>
        <div class="sub">touch-demo 场景 · test-pkg</div>

        <div class="group">
          <h2>场景切换</h2>
          <div class="btns">
            <div class="btn" data-cmd="gotoScene" data-scene="welcome">→ welcome</div>
            <div class="btn" data-cmd="gotoScene" data-scene="image-demo">→ image-demo</div>
            <div class="btn" data-cmd="gotoScene" data-scene="composite-demo">→ composite-demo</div>
            <div class="btn" data-cmd="gotoScene" data-scene="blank">→ blank</div>
          </div>
        </div>

        <div class="group">
          <h2>Macro 触发</h2>
          <div class="btns">
            <div class="btn" data-cmd="macro" data-macro="scenario.opening">scenario.opening</div>
            <div class="btn" data-cmd="macro" data-macro="scenario.touch-mode">scenario.touch-mode</div>
            <div class="btn" data-cmd="macro" data-macro="scenario.closing">scenario.closing</div>
            <div class="btn" data-cmd="macro" data-macro="scenario.nested-macro">nested-macro</div>
          </div>
        </div>

        <div class="group">
          <h2>系统 Action</h2>
          <div class="btns">
            <div class="btn" data-cmd="volume" data-val="0.5">音量 50%</div>
            <div class="btn" data-cmd="volume" data-val="1.0">音量 100%</div>
            <div class="btn" data-cmd="reload">scene.reload</div>
          </div>
        </div>

        <div class="group">
          <h2>自定义 Action（actions.js）</h2>
          <div class="btns">
            <div class="btn" data-cmd="customAction" data-action="test.hello" data-params='{"name":"框架"}'>test.hello</div>
            <div class="btn" data-cmd="customAction" data-action="test.fail">test.fail（预期报错）</div>
          </div>
        </div>

        <div class="group">
          <h2>埋点 emit</h2>
          <div class="btns">
            <div class="btn" data-cmd="emit">emit analytics</div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="log-head">事件日志</div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <script>
      const logEl = document.getElementById('log')
      function log(msg, cls = '') {
        const t = new Date().toLocaleTimeString('zh-CN')
        const d = document.createElement('div')
        d.innerHTML = `<span class="t">${t}</span><span class="${cls}">${msg}</span>`
        logEl.prepend(d)
      }

      ;(async () => {
        if (!window.exhibitBridge) { log('bridge 未注入', 'err'); return }

        await window.exhibitBridge.ready
        const info = window.exhibitBridge.getInfo()
        log(`bridge 就绪 display=${info?.displayId}`, 'ok')

        // 订阅场景切换
        window.exhibitBridge.on('scene:changed', e => {
          log(`[evt] scene:changed display=${e.displayId} → ${e.sceneId}`, 'evt')
        })

        // 按钮事件
        document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const cmd = btn.dataset.cmd

            if (cmd === 'gotoScene') {
              const sceneId = btn.dataset.scene
              log(`dispatch cmd.gotoScene sceneId=${sceneId}`)
              const r = await window.exhibitBridge.dispatch({ type: 'cmd.gotoScene', payload: { sceneId } })
              log(`→ ${r.ok ? 'ok' : 'fail: ' + r.error}`, r.ok ? 'ok' : 'err')

            } else if (cmd === 'macro') {
              const name = btn.dataset.macro
              log(`dispatch cmd.macro name=${name}`)
              const r = await window.exhibitBridge.dispatch({ type: 'cmd.macro', payload: { name } })
              log(`→ ${r.ok ? 'ok' : 'fail: ' + r.error}`, r.ok ? 'ok' : 'err')

            } else if (cmd === 'volume') {
              const value = parseFloat(btn.dataset.val)
              log(`dispatch cmd.volume value=${value}`)
              const r = await window.exhibitBridge.dispatch({ type: 'cmd.volume', payload: { value } })
              log(`→ ${r.ok ? 'ok' : 'fail: ' + r.error}`, r.ok ? 'ok' : 'err')

            } else if (cmd === 'reload') {
              log('dispatch cmd.reload')
              await window.exhibitBridge.dispatch({ type: 'cmd.reload', payload: {} })

            } else if (cmd === 'customAction') {
              const action = btn.dataset.action
              const params = btn.dataset.params ? JSON.parse(btn.dataset.params) : {}
              log(`dispatch ${action} params=${JSON.stringify(params)}`)
              const r = await window.exhibitBridge.dispatch({ type: action, payload: params })
              log(`→ ${r.ok ? JSON.stringify(r.data) : 'fail: ' + r.error}`, r.ok ? 'ok' : 'err')

            } else if (cmd === 'emit') {
              window.exhibitBridge.emit('analytics', { action: 'test-button-click', at: Date.now() })
              log('emit analytics → 主进程日志可见', 'ok')
            }
          })
        })
      })()
    </script>
  </body>
</html>
